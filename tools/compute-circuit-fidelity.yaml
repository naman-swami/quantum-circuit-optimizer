annotations:
  cost: none
  read_only: true
  requires_confirmation: false
description: Estimate total circuit quantum volume and randomized benchmarking survival
  probability.
input_schema:
  additionalProperties: false
  properties:
    gate_counts:
      type: string
    t1_t2_coherence_times:
      type: string
  required:
  - gate_counts
  type: object
name: compute-circuit-fidelity
output_schema:
  additionalProperties: false
  properties:
    confidence:
      type: number
    data:
      type: string
    status:
      type: string
  required:
  - status
  - data
  type: object
