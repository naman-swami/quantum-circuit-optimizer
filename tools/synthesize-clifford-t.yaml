annotations:
  cost: none
  read_only: true
  requires_confirmation: false
description: Decompose arbitrary unitary rotation gates into canonical single-qubit
  gates and T-depth minimized sequences.
input_schema:
  additionalProperties: false
  properties:
    epsilon_precision:
      type: number
    unitary_matrix:
      type: string
  required:
  - unitary_matrix
  type: object
name: synthesize-clifford-t
output_schema:
  additionalProperties: false
  properties:
    confidence:
      type: number
    data:
      type: string
    status:
      type: string
  required:
  - status
  - data
  type: object
